name: android

# 安卓外壳构建（FnCal-Android）。本机无 Android SDK，只能在这里出包。
# 手动触发，或 android/ 目录与工作流本身有改动时触发。
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 0.3.7（包体瘦身）：发布包改走 release + R8（minify + shrinkResources），
      # 签名仍是固定测试 keystore，保证覆盖升级、证书指纹不变。
      # 0.4.1：出包前先跑卡片逻辑的纯 Kotlin 单测（两组，见 design/widget-041）。
      - name: Unit tests (widget stats)
        working-directory: android
        run: |
          gradle testDebugUnitTest --no-daemon --stacktrace \
            --tests "*.WidgetStatsTest" \
            --tests "*.WidgetTagFieldsTest"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Inspect APK
        working-directory: android
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -l "$APK"
          sha256sum "$APK"
          echo "$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -1
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/aapt"
          # 0.3.0（§A5）：版本号必须真的打进包里，避免 tag 与包内容对不上。
          "$AAPT" dump badging "$APK" | tee badging.txt | head -6
          grep -q "versionCode='402'" badging.txt
          grep -q "versionName='0.4.2'" badging.txt
          # 0.2.1（§S1）：打印签名证书指纹；同一签名的包才能覆盖升级。
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-signature.txt
          grep -q "SHA-256 digest: 0a7889854bb2e8a82153a15d59a348676d772a8a22f7c971cf98a7f1c08c3ace" apk-signature.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FnCal-Android-release
          # 0.3.7：额外带上 R8 的 mapping.txt，线上崩溃堆栈要靠它还原。
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # 0.3.8：只在 main 上发布 Release；分支构建只出 artifact，用户验收前不公开发。
      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          OUT=FnCal-Android-0.4.2.apk
          cp "$APK" "$OUT"
          TAG=android-v0.4.2
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$OUT"; then
            echo "资产 $OUT 已存在，跳过覆盖（已发布的包不改字节）"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖资产"
          else
            gh release create "$TAG" \
              --title "FnCal Android 0.4.2" \
              --notes "安卓外壳 0.4.2（固定测试签名，可直接覆盖升级）。启动图标修复：自适应图标前景由 66% 缩到 54%，不再贴住安全区边缘，圆形与圆角遮罩下留白一致。其余同 0.4.1：桌面卡片九款（小月历、今日日程、大月历、四日、日程列表、当月热度、当月分类、一周节奏、时段分析）；四日与日程列表默认 4×2 可拉到 4×4，统计四款默认 2×2 可拉到 4×2；日程列表每行显示开始至结束时间；大月历徽章全天实底、定时淡底加细边；主题色读网页设置。" \
              --latest=false
          fi
          gh release upload "$TAG" "$OUT" --clobber
