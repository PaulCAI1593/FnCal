name: android

# 安卓外壳构建（FnCal-Android）。本机无 Android SDK，只能在这里出包。
# 手动触发，或 android/ 目录与工作流本身有改动时触发。
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 0.3.7（包体瘦身）：发布包改走 release + R8（minify + shrinkResources），
      # 签名仍是固定测试 keystore，保证覆盖升级、证书指纹不变。
      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Inspect APK
        working-directory: android
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -l "$APK"
          sha256sum "$APK"
          echo "$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -1
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/aapt"
          # 0.3.0（§A5）：版本号必须真的打进包里，避免 tag 与包内容对不上。
          "$AAPT" dump badging "$APK" | tee badging.txt | head -6
          grep -q "versionCode='307'" badging.txt
          grep -q "versionName='0.3.7'" badging.txt
          # 0.2.1（§S1）：打印签名证书指纹；同一签名的包才能覆盖升级。
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-signature.txt
          grep -q "SHA-256 digest: 0a7889854bb2e8a82153a15d59a348676d772a8a22f7c971cf98a7f1c08c3ace" apk-signature.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FnCal-Android-release
          # 0.3.7：额外带上 R8 的 mapping.txt，线上崩溃堆栈要靠它还原。
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish release asset
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          OUT=FnCal-Android-0.3.7.apk
          cp "$APK" "$OUT"
          TAG=android-v0.3.7
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$OUT"; then
            echo "资产 $OUT 已存在，跳过覆盖（已发布的包不改字节）"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖资产"
          else
            gh release create "$TAG" \
              --title "FnCal Android 0.3.7" \
              --notes "安卓外壳测试包（固定测试签名，可直接覆盖升级）。本版改为 release 构建并开启 R8，包体约减半；功能与 0.3.6 相同。更新仍是两源：先试 Gitee 镜像，清单过期或不可用再试 GitHub 直通；清单里的 apkCn 与 GitHub Release 包互为备份，下载失败自动换一个再试一次。继续带 0.3.5 的服务器版本刷新与 0.3.4 的更新安装与卡片改版。到点提醒不在本版。" \
              --latest=false
          fi
          gh release upload "$TAG" "$OUT" --clobber
