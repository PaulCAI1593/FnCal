name: android

# 安卓外壳构建（FnCal-Android）。本机无 Android SDK，只能在这里出包。
# 手动触发，或 android/ 目录与工作流本身有改动时触发。
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Inspect APK
        working-directory: android
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -l "$APK"
          sha256sum "$APK"
          echo "$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -1
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/aapt"
          # 0.3.0（§A5）：版本号必须真的打进包里，避免 tag 与包内容对不上。
          "$AAPT" dump badging "$APK" | tee badging.txt | head -6
          grep -q "versionCode='300'" badging.txt
          grep -q "versionName='0.3.0'" badging.txt
          # 0.2.1（§S1）：打印签名证书指纹；同一签名的包才能覆盖升级。
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-signature.txt
          grep -q "SHA-256 digest: 0a7889854bb2e8a82153a15d59a348676d772a8a22f7c971cf98a7f1c08c3ace" apk-signature.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FnCal-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release asset
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=FnCal-Android-0.3.0.apk
          cp "$APK" "$OUT"
          TAG=android-v0.3.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖资产"
          else
            gh release create "$TAG" \
              --title "FnCal Android 0.3.0" \
              --notes "安卓外壳测试包（固定测试签名，可直接覆盖升级）。本版新增五款桌面卡片（迷你月历 / 单日日程 / 月视图 / 四日视图 / 日程列表）：在「关于 → 桌面卡片」粘一次只读令牌即可，卡片每 30 分钟刷新，断网显示缓存与上次更新时间；点卡片直接打开对应视图与日期。地址页标题上方加了 FnCal 标志，状态栏与手势条保持透明。到点提醒不在本版。" \
              --latest=false
          fi
          gh release upload "$TAG" "$OUT" --clobber
